<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Milly's Arts</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="./assets/img/logo-mini.png" type="image/png">
    <meta name="theme-color" content="#fff6fc">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main class="login-page">
        <form class="login-card" id="formLogin">
            <img src="./assets/img/logo-mini.png" alt="Milly's Arts" width="88" height="88">

            <h1>Painel admin</h1>
            <p>Entre para gerenciar produtos e cupons.</p>

            <div class="campo">
                <label for="emailLogin">E-mail</label>
                <input type="email" id="emailLogin" required placeholder="email@email.com" autocomplete="username">
            </div>

            <div class="campo">
                <label for="senhaLogin">Senha</label>
                <input type="password" id="senhaLogin" required placeholder="Sua senha" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">
                Entrar
            </button>

            <p id="loginErro" class="login-erro" aria-live="polite"></p>

            <a href="index.html" class="login-voltar">Voltar para a loja</a>
        </form>
    </main>

    <script src="./js/supabase.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
